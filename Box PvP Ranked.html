 const ax=x1-x0>1,u0=ax?x0:z0,u1=ax?x1:z1,uc=(u0+u1)/2,B=(a,b,c,d)=>ax?[a,b,c,d,z0,z1]:[x0,x1,c,d,a,b],o=[B(u0,uc-.8,y0,y1),B(uc+.8,u1,y0,y1),B(uc-.8,uc+.8,y0+3,y1)];
 if(p.ed===2)o.push(B(uc-.8,uc+.8,y0,y0+1));return o}
function mk(p){
 if(p.grp)sc.remove(p.grp);const g=new V.Group();p.ms=[];p.bs=cut(p);
 for(const b of p.bs){const m=new V.Mesh(new V.BoxGeometry(b[1]-b[0],b[3]-b[2],b[5]-b[4]),MT[p.t]);m.position.set((b[0]+b[1])/2,(b[2]+b[3])/2,(b[4]+b[5])/2);m.userData.p=p;g.add(m);p.ms.push(m)}
 p.grp=g;sc.add(g);g.updateMatrixWorld(true)}
function build(e,type){
 const ly=Math.floor((e.y+.3)/4)*4,fx=-Math.sin(e.yaw),fz=-Math.cos(e.yaw);
 let ax=Math.abs(fx)>Math.abs(fz)?1:0,sx=ax?Math.sign(fx):0,sz=ax?0:Math.sign(fz);
 const cx=Math.floor(e.x/4)*4+2,cz=Math.floor(e.z/4)*4+2;let x,y,z,w,h,d,rot=0;
 if(type==='w'){x=cx+sx*2;z=cz+sz*2;y=ly+2;w=ax?.3:4;h=4;d=ax?4:.3}
 else{x=cx+sx*4;z=cz+sz*4;if(type==='f'){y=ly-.15;w=4;h=.3;d=4}else{y=ly+2;w=4;h=.3;d=5.66;rot=Math.atan2(sx,sz)}}
 if(Math.abs(x)>38||Math.abs(z)>38||pcs.some(p=>p.t===type&&p.x===x&&p.y===y&&p.z===z&&p.rot===rot))return;
 const p={t:type,x,y,z,hp:130,rot,sx,sz,ly,ed:0,b:[x-w/2,x+w/2,y-h/2,y+h/2,z-d/2,z+d/2]};
 if(type==='r'){const m=new V.Mesh(new V.BoxGeometry(4,.3,5.66),MT.r);m.rotation.x=-Math.PI/4;const wr=new V.Group();wr.position.set(x,y,z);wr.rotation.y=rot;wr.add(m);wr.updateMatrixWorld(true);m.userData.p=p;p.ms=[m];p.grp=wr;p.bs=[];sc.add(wr)}else mk(p);
 pcs.push(p);
}
function editPiece(){
 if(!P||P.dead)return;cam.updateMatrixWorld();const d=new V.Vector3(0,0,-1).applyEuler(cam.rotation),o=cam.position.clone().addScaledVector(d,3.4);
 rc.set(o,d);rc.far=14;const h=rc.intersectObjects(pcs.flatMap(p=>p.ms))[0];
 if(!h)return say('Vise une construction');
 const p=h.object.userData.p;if(p.t==='r')return say('Rampe non modifiable');
 p.ed=(p.ed+1)%(p.t==='w'?3:2);mk(p);say(p.t==='w'?['Mur plein','Porte','Fenêtre'][p.ed]:['Sol plein','Trou'][p.ed])}
function rm(p){sc.remove(p.grp);pcs.splice(pcs.indexOf(p),1)}
function rH(p,x,z){return p.ly+((x-p.x)*p.sx+(z-p.z)*p.sz)+2}
function inF(p,x,z){return Math.abs(x-p.x)<=2.3&&Math.abs(z-p.z)<=2.3}
function blocked(x,y,z){
 for(const p of pcs){
  if(p.t==='r'){if(inF(p,x,z)){const h=rH(p,x,z);if(h>y+.7&&h-.3<y+1.8)return 1}continue}
  for(const b of p.bs)if(x+.35>b[0]&&x-.35<b[1]&&z+.35>b[4]&&z-.35<b[5]&&y+1.8>b[2]&&y+.55<b[3])return 1}
 return 0}
function gH(x,y,z){let g=0;for(const p of pcs){if(p.t==='w')continue;if(p.t==='r'){if(inF(p,x,z)){const t=rH(p,x,z);if(t<=y+.7&&t>g)g=t}continue}
 for(const b of p.bs)if(x>b[0]-.15&&x<b[1]+.15&&z>b[4]-.15&&z<b[5]+.15&&b[3]<=y+.7&&b[3]>g)g=b[3]}return g}
function phys(e,dt,mx,mz,jump){
 let nx=e.x+mx*e.sp*dt;if(Math.abs(nx)<38&&(!blocked(nx,e.y,e.z)||blocked(e.x,e.y,e.z)))e.x=nx;
 let nz=e.z+mz*e.sp*dt;if(Math.abs(nz)<38&&(!blocked(e.x,e.y,nz)||blocked(e.x,e.y,e.z)))e.z=nz;
 const g=gH(e.x,e.y,e.z);
 if(e.vy<=0&&(e.y<=g+.05||(e.on&&e.y-g<.6))){e.y=g;e.vy=0;e.on=1;if(jump){e.vy=9.5;e.on=0}}else e.on=0;
 e.vy-=28*dt;e.y+=e.vy*dt;if(e.y<g){e.y=g;e.vy=0}
}

/* ---------- combat ---------- */
const WP=[{n:'AR',dmg:18,r:.13,sp:.012,pl:1,rg:90},{n:'PUMP',dmg:12,r:.85,sp:.05,pl:8,rg:30}];
let ents=[],P,mode='menu',T=0,tl=0,tick=0,msgT=0,PV,mpts=0;
function tracer(a,b){const g=new V.BufferGeometry().setFromPoints([a,b]);const l=new V.Line(g,new V.LineBasicMaterial({color:0xffee88}));sc.add(l);TRC.push({l,t:.07})}
function hitscan(o,d,sh,wp){
 rc.set(o,d);rc.far=wp.rg;const hit=rc.intersectObjects(pcs.flatMap(p=>p.ms));let best=hit[0]?hit[0].distance:wp.rg,tg=null,pc=hit[0]?hit[0].object:null;
 for(const e of ents){if(e===sh||e.dead)continue;const c=new V.Vector3(e.x,e.y+1,e.z).sub(o),t=c.dot(d);if(t<0||t>best)continue;if(c.addScaledVector(d,-t).length()<.8){best=t;tg=e;pc=null}}
 if(tg)dmg(tg,wp.dmg,sh);else if(pc){const p=pc.userData.p;p.hp-=wp.dmg;if(p.hp<=0)rm(p)}
 const st=o.clone().addScaledVector(d,sh===P?3.2:.5);tracer(st,o.clone().addScaledVector(d,best));
}
function say(t){$('#msg').textContent=t;msgT=1.8}
function dmg(e,d,by){
 if(e.dead)return;e.hp-=d;e.hit=1;
 if(e.hp<=0){e.dead=1;e.rt=2.5;e.deaths++;e.model.visible=false;by.kills++;by.hp=100;
  if(by===P){by.str++;const b=10+Math.min(by.str-1,5)*2;mpts+=b;say('ÉLIMINATION +'+b+' pts')}
  if(e===P){mpts-=2;P.str=0;say('Éliminé par '+by.name)}
  if(by.bot)by.dance=1.5;}
}
function spawn(e){let x,z,n=0;do{x=R(-30,30);z=R(-30,30)}while(blocked(x,0,z)&&n++<30);e.x=x;e.z=z;e.y=0;e.vy=0;e.hp=100;e.dead=0;e.model.visible=true;e.yaw=R(0,6)}
function mkEnt(name,bot,sk,bg,dn){const m=mkChar(sk,bg);sc.add(m);return{name,bot,sk,bg,dn,model:m,x:0,y:0,z:0,vy:0,on:1,yaw:0,pitch:0,sp:bot?6.5:9,hp:100,kills:0,deaths:0,cd:0,g:0,dance:0,rt:0,str:0,react:0,sd:1,sdT:0,bt:R(1,3),jt:R(1,3),firing:0,mv:0}}
function botAI(b,dt){
 let tg=null,bd=1e9;for(const o of ents){if(o===b||o.dead)continue;const d=Math.hypot(o.x-b.x,o.z-b.z);if(d<bd){bd=d;tg=o}}
 if(!tg||b.dance>0){b.mv=0;return}
 const dx=tg.x-b.x,dz=tg.z-b.z,ux=dx/bd,uz=dz/bd,ty=Math.atan2(-dx,-dz);
 let dy=ty-b.yaw;dy=Math.atan2(Math.sin(dy),Math.cos(dy));b.yaw+=dy*Math.min(1,dt*6);
 b.sdT-=dt;if(b.sdT<=0){b.sdT=R(.7,1.8);b.sd=Math.random()<.5?-1:1}
 const f=bd>16?1:bd<7?-1:0;let mx=ux*f-uz*b.sd*.8,mz=uz*f+ux*b.sd*.8;const l=Math.hypot(mx,mz)||1;
 b.jt-=dt;let j=0;if(b.jt<=0){b.jt=R(1,3);j=1}
 phys(b,dt,mx/l,mz/l,j);b.mv=1;
 b.bt-=dt;if(b.bt<=0&&bd<30){b.bt=R(7,11);build(b,'w')}
 b.cd-=dt;b.react-=dt;if(b.lt!==tg){b.lt=tg;b.react=R(.9,1.6)}
 if(b.cd<=0&&b.react<=0&&bd<38&&Math.abs(dy)<.35){b.cd=.34;const o=new V.Vector3(b.x,b.y+1.5,b.z),d=new V.Vector3(dx,tg.y+1-(b.y+1.5),dz).normalize();
  d.x+=R(-.14,.14);d.y+=R(-.1,.1);d.z+=R(-.14,.14);d.normalize();hitscan(o,d,b,{dmg:6,rg:90})}
}
/* ---------- entrées ---------- */
const S={l:null,k:{}};let looking=null;
const G=$('#game');
G.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;G.setPointerCapture(e.pointerId);
 if(e.clientX<innerWidth*.45&&!S.l){S.l={id:e.pointerId,ox:e.clientX,oy:e.clientY,x:e.clientX,y:e.clientY};const s=$('#stk');s.style.display='block';s.style.left=e.clientX-50+'px';s.style.top=e.clientY-50+'px'}
 else if(!looking)looking={id:e.pointerId,x:e.clientX,y:e.clientY}});
G.addEventListener('pointermove',e=>{
 if(S.l&&S.l.id===e.pointerId){S.l.x=e.clientX;S.l.y=e.clientY;const dx=Math.max(-40,Math.min(40,S.l.x-S.l.ox)),dy=Math.max(-40,Math.min(40,S.l.y-S.l.oy));$('#stk i').style.transform=`translate(${dx}px,${dy}px)`}
 if(looking&&looking.id===e.pointerId&&P){P.yaw-=(e.clientX-looking.x)*.0065;P.pitch=Math.max(-1.1,Math.min(1.2,P.pitch-(e.clientY-looking.y)*.0055));looking.x=e.clientX;looking.y=e.clientY}});
const up=e=>{if(S.l&&S.l.id===e.pointerId){S.l=null;$('#stk').style.display='none';$('#stk i').style.transform=''}if(looking&&looking.id===e.pointerId)looking=null};
G.addEventListener('pointerup',up);G.addEventListener('pointercancel',up);
function hold(id,on,off){const b=$(id);b.addEventListener('pointerdown',e=>{e.stopPropagation();e.preventDefault();on()});if(off){b.addEventListener('pointerup',off);b.addEventListener('pointerleave',off);b.addEventListener('pointercancel',off)}}
let jmp=0,bcd=0;
hold('#fire',()=>P.firing=1,()=>P&&(P.firing=0));hold('#jump',()=>jmp=1,()=>jmp=0);
hold('#bw',()=>P.bq='w');hold('#bf',()=>P.bq='f');hold('#br',()=>P.bq='r');
hold('#wp',()=>{P.g^=1;$('#wp').textContent=WP[P.g].n});hold('#dn',()=>{if(!P.dead)P.dance=3});hold('#ed',editPiece);
addEventListener('keydown',e=>{if(!P)return;const k=e.key.toLowerCase();S.k[k]=1;if(k===' ')jmp=1;if(k==='1')P.bq='w';if(k==='2')P.bq='f';if(k==='3')P.bq='r';if(k==='f')P.firing=1;if(k==='g')P.dance=3;if(k==='e')editPiece()});
addEventListener('keyup',e=>{const k=e.key.toLowerCase();S.k[k]=0;if(k===' ')jmp=0;if(k==='f'&&P)P.firing=0});

/* ---------- boucle de match ---------- */
function startGame(){
 pcs.forEach(p=>sc.remove(p.grp));pcs=[];ents.forEach(e=>sc.remove(e.model));
 if(PV)PV.visible=false;sc.fog=new V.Fog(0x8fd3ff,50,130);
 P=mkEnt('Toi',0,get('skin',save.eq.skin),get('bag',save.eq.bag),+save.eq.dance.slice(1));P.bq=null;
 ents=[P,mkEnt('Nova',1,SK[1],BG[1],2),mkEnt('Rex',1,SK[3],BG[2],4)];ents.forEach(spawn);
 mpts=0;tl=180;mode='game';$$('.scr').forEach(s=>s.classList.toggle('on',s.id==='game'));G.style.display='block';say('Fonce ! 15 éliminations ou 3 min');
}
function update(dt){
 tl-=dt;
 let mx=0,mz=0;const f=[-Math.sin(P.yaw),-Math.cos(P.yaw)],r=[Math.cos(P.yaw),-Math.sin(P.yaw)];
 if(S.l){const dx=S.l.x-S.l.ox,dy=S.l.y-S.l.oy,l=Math.hypot(dx,dy);if(l>6){const k=Math.min(1,l/40),sx=dx/l*k,sy=dy/l*k;mx=f[0]*-sy+r[0]*sx;mz=f[1]*-sy+r[1]*sx}}
 if(S.k.w){mx+=f[0];mz+=f[1]}if(S.k.s){mx-=f[0];mz-=f[1]}if(S.k.d){mx+=r[0];mz+=r[1]}if(S.k.a){mx-=r[0];mz-=r[1]}
 for(const e of ents){
  if(e.dead){e.rt-=dt;if(e.rt<=0)spawn(e);continue}
  e.cd-=dt;if(e.dance>0)e.dance-=dt;
  if(e===P){const mv=Math.hypot(mx,mz)>.1;if(mv)e.dance=0;e.mv=mv;
   phys(e,dt,mx,mz,jmp);
   bcd-=dt;if(e.bq&&bcd<=0){build(e,e.bq);bcd=.12}e.bq=null;
   if(e.firing&&e.cd<=0){e.dance=0;const w=WP[e.g];e.cd=w.r;cam.updateMatrixWorld();const d0=new V.Vector3(0,0,-1).applyEuler(cam.rotation);
    for(let i=0;i<w.pl;i++){const d=d0.clone();d.x+=R(-w.sp,w.sp);d.y+=R(-w.sp,w.sp);d.z+=R(-w.sp,w.sp);hitscan(cam.position.clone().addScaledVector(d0,3.4),d.normalize(),e,w)}}
  }else botAI(e,dt);
  e.model.position.set(e.x,e.y,e.z);e.model.rotation.y=e.yaw;anim(e.model,e.dn,T,e.mv,e.dance>0);
  e.model.userData.g.scale.setScalar(e.hit>0?1.06:1);e.hit=Math.max(0,(e.hit||0)-dt*5);
 }
 for(let i=TRC.length-1;i>=0;i--){TRC[i].t-=dt;if(TRC[i].t<=0){sc.remove(TRC[i].l);TRC.splice(i,1)}}
 /* caméra épaule */
 cam.rotation.set(P.pitch,P.yaw,0);const off=new V.Vector3(1,.55,3.8).applyEuler(cam.rotation);
 cam.position.set(P.x,P.y+1.5,P.z).add(off);if(cam.position.y<.4)cam.position.y=.4;
 msgT-=dt;if(msgT<=0)$('#msg').textContent='';
 $('#hp i').style.width=Math.max(0,P.hp)+'%';$('#hp i').style.background=P.hp>40?'#3ddc84':'#ff4d4d';
 if((tick+=dt)>.25){tick=0;const s=[...ents].sort((a,b)=>b.kills-a.kills);$('#sb').innerHTML=s.map(e=>(e===P?'⭐ ':'')+e.name+' · '+e.kills).join('<br>');
  const t=Math.max(0,Math.ceil(tl));$('#tm').innerHTML='⏱ '+Math.floor(t/60)+':'+String(t%60).padStart(2,'0')+'<br>'+(mpts>=0?'+':'')+mpts+' pts'}
 if(tl<=0||ents.some(e=>e.kills>=15))finish();
}
function rankOf(p){let i=0;RANKS.forEach((r,k)=>{if(p>=r[1])i=k});return i}
function finish(){
 if(mode!=='game')return;mode='end';
 const s=[...ents].sort((a,b)=>b.kills-a.kills),pl=s.indexOf(P)+1,gain=Math.max(mpts,0)+(pl===1?30:pl===2?10:0)-(pl===3?8:0),coins=P.kills*15+(pl===1?100:0),old=save.pts;
 save.pts=Math.max(0,save.pts+gain);save.coins+=coins;if(pl===1)save.wins++;persist();
 $('#et').textContent=pl===1?'🏆 VICTOIRE':'#'+pl;$('#es').textContent=P.kills+' éliminations · '+P.deaths+' morts';
 $('#ep').textContent=(gain>=0?'+':'')+gain+' pts · '+RANKS[rankOf(save.pts)][0]+(rankOf(save.pts)>rankOf(old)?' ⬆️':'');$('#ec').textContent='+'+coins+' 🪙';
 G.style.display='none';sc.fog=null;$$('.scr').forEach(x=>x.classList.toggle('on',x.id==='end'));ui();
}
/* ---------- menu / boutique ---------- */
let tab='skin';
function setPV(){if(PV)sc.remove(PV);PV=mkChar(get('skin',save.eq.skin),get('bag',save.eq.bag));PV.position.set(300,0,300);sc.add(PV)}
function ui(){
 $('#c1').textContent=$('#c2').textContent='🪙 '+save.coins;
 const i=rankOf(save.pts),n=RANKS[i+1];$('#rn').textContent=RANKS[i][0];
 $('#rp').textContent=save.pts+' pts'+(n?' · prochain rang : '+n[1]:' · rang max')+' · '+save.wins+' victoires';
 $('#rb').style.width=(n?(save.pts-RANKS[i][1])/(n[1]-RANKS[i][1])*100:100)+'%';renderGrid();setPV();
}
function renderGrid(){
 const g=$('#grid');g.innerHTML='';
 ITEMS[tab].forEach(it=>{const own=save.own[tab].includes(it.id),eq=save.eq[tab]===it.id,d=document.createElement('div');d.className='it'+(eq?' eq':own?' ow':'');
  const col='#'+(it.c!==undefined?it.c.toString(16).padStart(6,'0'):'888');
  d.innerHTML=(tab==='dance'?`<div style="font-size:28px">${['👋','🌀','🦘','🪩','🌪️'][DN.indexOf(it)]}</div>`:`<div class="sw" style="background:${col}"></div>`)+`<b>${it.n}</b><span>${eq?'Équipé':own?'Équiper':'🪙 '+it.p}</span>`;
  d.onclick=()=>{if(!own){if(save.coins<it.p){d.querySelector('span').textContent='Pas assez !';return}save.coins-=it.p;save.own[tab].push(it.id)}save.eq[tab]=it.id;persist();ui()};g.appendChild(d)});
}
function scr(id){mode=id==='game'?'game':'menu';$$('.scr').forEach(s=>s.classList.toggle('on',s.id===id));if(PV)PV.visible=true;sc.fog=null;ui()}
$$('.tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;$$('.tabs button').forEach(x=>x.classList.toggle('a',x===b));renderGrid()});
$('#toshop').onclick=()=>scr('shop');$('#back').onclick=()=>scr('menu');$('#tomenu').onclick=()=>scr('menu');$('#play').onclick=$('#again').onclick=startGame;
ents.forEach(e=>0);
function nofs(){const t=$('#tt');t.textContent='Plein écran indisponible ici : ouvre le lien dans ton navigateur ou ajoute la page à l’écran d’accueil.';t.style.display='block';setTimeout(()=>t.style.display='none',3500)}
function fs(){const d=document.documentElement,f=d.requestFullscreen||d.webkitRequestFullscreen;try{if(document.fullscreenElement||document.webkitFullscreenElement)(document.exitFullscreen||document.webkitExitFullscreen).call(document);else if(f){const r=f.call(d);if(r&&r.then)r.then(()=>{try{screen.orientation.lock('landscape')}catch(e){}}).catch(nofs)}else nofs()}catch(e){nofs()}}
$('#fs').addEventListener('click',fs);$('#fsm').addEventListener('click',fs);
let last=performance.now();
function loop(n){
 const dt=Math.min(.05,(n-last)/1000);last=n;T+=dt;
 if(mode==='game'){update(dt)}
 else if(PV){anim(PV,+save.eq.dance.slice(1),T,0,1);PV.rotation.y=Math.sin(T*.7)*.7;cam.position.set(300,1.6,305.5);cam.lookAt(300,.55,300)}
 rd.render(sc,cam);requestAnimationFrame(loop);
}
sc.fog=null;ui();requestAnimationFrame(loop);
</script></body></html>
